<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cartoon Police Chase</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#55c9ff;
}
canvas{
 display:block;
 width:100%;
 height:100%;
}
#hud{
 position:fixed;
 top:8px;
 left:10px;
 right:10px;
 z-index:10;
 display:flex;
 justify-content:space-between;
 color:white;
 font-size:22px;
 font-weight:bold;
 text-shadow:2px 2px 4px #000;
}
#mission{
 position:fixed;
 top:55px;
 left:50%;
 transform:translateX(-50%);
 background:#111d;
 color:white;
 padding:10px 18px;
 border-radius:25px;
 z-index:10;
 font-size:18px;
 font-weight:bold;
}
#menu,#over{
 position:fixed;
 inset:0;
 z-index:30;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#0008;
}
.box{
 width:90%;
 max-width:390px;
 padding:25px;
 text-align:center;
 background:#171717;
 color:white;
 border:4px solid #ffd21c;
 border-radius:28px;
}
.box h1{
 font-size:34px;
 margin:5px 0 20px;
}
.box p{
 font-size:18px;
 line-height:1.6;
}
button{
 border:0;
 border-radius:18px;
 background:#ffd21c;
 color:#111;
 font-size:22px;
 font-weight:bold;
 padding:16px 30px;
}
#over{display:none}

.controls{
 position:fixed;
 left:0;
 right:0;
 bottom:20px;
 z-index:20;
 display:flex;
 justify-content:space-between;
 padding:0 25px;
}
.ctrl{
 width:70px;
 height:65px;
 padding:0;
 background:#fff;
 border:3px solid #222;
 font-size:30px;
 opacity:.9;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div>🏆 Score: <span id="score">0</span></div>
 <div>🪙 Coins: <span id="coins">0</span></div>
</div>

<div id="mission">
 🎯 Mission: 20 Coins (0/20)
</div>

<div id="menu">
 <div class="box">
  <h1>🏃 CARTOON RUNNER</h1>

  <p>🚆 Train से बचो</p>
  <p>🌳 पेड़ों के बीच दौड़ो</p>
  <p>🪙 Coins जमा करो</p>
  <p>👮 Police से बचो</p>

  <button id="startBtn">▶️ GAME START</button>
 </div>
</div>

<div id="over">
 <div class="box">
  <h1>🚨 GAME OVER</h1>

  <p>👮 Police ने पकड़ लिया!</p>

  <p>
   🏆 Score:
   <b id="finalScore">0</b>
  </p>

  <p>
   🪙 Coins:
   <b id="finalCoins">0</b>
  </p>

  <button id="restartBtn">🔄 फिर से खेलें</button>
 </div>
</div>

<div class="controls">
 <button class="ctrl" id="leftBtn">⬅️</button>
 <button class="ctrl" id="jumpBtn">⬆️</button>
 <button class="ctrl" id="rightBtn">➡️</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
 W=innerWidth;
 H=innerHeight;
 canvas.width=W;
 canvas.height=H;
}

resize();
addEventListener("resize",resize);


/* IMAGES */

const playerImg=new Image();
playerImg.src="character.jpg";

const policeImg=new Image();
policeImg.src="police.png";


/* GAME */

let playing=false;
let score=0;
let coins=0;

let lane=1;
let targetLane=1;

let jump=0;
let jumpSpeed=0;

let speed=6;

let trains=[];
let coinList=[];
let treeList=[];

let spawnTimer=0;
let coinTimer=0;


/* START */

function startGame(){

 playing=true;

 score=0;
 coins=0;

 lane=1;
 targetLane=1;

 jump=0;
 jumpSpeed=0;

 speed=6;

 trains=[];
 coinList=[];

 document.getElementById("menu").style.display="none";
 document.getElementById("over").style.display="none";

 requestAnimationFrame(loop);
}


/* GAME OVER */

function gameOver(){

 playing=false;

 document.getElementById("finalScore").textContent=
 Math.floor(score);

 document.getElementById("finalCoins").textContent=
 coins;

 document.getElementById("over").style.display="flex";
}


/* LANES */

function laneX(n){
 return W/2+(n-1)*W*.22;
}


/* LEFT */

function moveLeft(){

 if(!playing)return;

 targetLane--;

 if(targetLane<0)
 targetLane=0;
}


/* RIGHT */

function moveRight(){

 if(!playing)return;

 targetLane++;

 if(targetLane>2)
 targetLane=2;
}


/* JUMP */

function doJump(){

 if(!playing)return;

 if(jump===0){
  jump=1;
  jumpSpeed=15;
 }
}


/* BUTTONS */

document.getElementById("leftBtn")
.addEventListener("click",moveLeft);

document.getElementById("rightBtn")
.addEventListener("click",moveRight);

document.getElementById("jumpBtn")
.addEventListener("click",doJump);

document.getElementById("startBtn")
.addEventListener("click",startGame);

document.getElementById("restartBtn")
.addEventListener("click",startGame);


/* KEYBOARD */

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft")
 moveLeft();

 if(e.key==="ArrowRight")
 moveRight();

 if(e.key==="ArrowUp" || e.code==="Space")
 doJump();

});


/* TRAIN */

function addTrain(){

 let n=Math.floor(Math.random()*3);

 trains.push({
  lane:n,
  y:-180
 });

}


/* COIN */

function addCoin(){

 let n=Math.floor(Math.random()*3);

 coinList.push({
  lane:n,
  y:-40,
  spin:0
 });

}


/* TREES */

function drawTree(x,y,size){

 ctx.fillStyle="#75462b";

 ctx.fillRect(
  x-size*.12,
  y,
  size*.24,
  size*.9
 );

 ctx.fillStyle="#159447";

 ctx.beginPath();
 ctx.arc(
  x,
  y-size*.15,
  size*.5,
  0,
  Math.PI*2
 );
 ctx.fill();

 ctx.fillStyle="#24ad4d";

 ctx.beginPath();
 ctx.arc(
  x-size*.3,
  y-size*.05,
  size*.35,
  0,
  Math.PI*2
 );
 ctx.fill();

 ctx.beginPath();
 ctx.arc(
  x+size*.3,
  y-size*.05,
  size*.35,
  0,
  Math.PI*2
 );
 ctx.fill();
}


/* ROAD */

function drawRoad(){

 /* sky */

 ctx.fillStyle="#55c9ff";
 ctx.fillRect(0,0,W,H);


 /* grass */

 ctx.fillStyle="#4c9943";
 ctx.fillRect(0,0,W,H);


 /* road perspective */

 ctx.fillStyle="#303030";

 ctx.beginPath();

 ctx.moveTo(W*.18,0);
 ctx.lineTo(W*.82,0);
 ctx.lineTo(W, H);
 ctx.lineTo(0,H);
 ctx.closePath();

 ctx.fill();


 /* road edges */

 ctx.strokeStyle="#fff";
 ctx.lineWidth=7;

 ctx.beginPath();
 ctx.moveTo(W*.18,0);
 ctx.lineTo(0,H);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(W*.82,0);
 ctx.lineTo(W,H);
 ctx.stroke();


 /* lane lines */

 ctx.strokeStyle="#ddd";
 ctx.lineWidth=4;

 ctx.setLineDash([35,35]);

 ctx.beginPath();
 ctx.moveTo(W*.39,0);
 ctx.lineTo(W*.33,H);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(W*.61,0);
 ctx.lineTo(W*.67,H);
 ctx.stroke();

 ctx.setLineDash([]);


 /* trees */

 for(let i=0;i<7;i++){

  let y=(i*170+(score*3))%H;

  drawTree(
   W*.08,
   y,
   55
  );

  drawTree(
   W*.92,
   y+80,
   55
  );
 }
}


/* PLAYER */

function drawPlayer(){

 let x=laneX(targetLane);

 lane+=
 (targetLane-lane)*.12;

 x=laneX(
  Math.round(lane)
 );


 let y=
 H-190-jump;


 if(playerImg.complete){

  ctx.drawImage(
   playerImg,
   x-65,
   y,
   130,
   170
  );

 }else{

  ctx.fillStyle="#111";

  ctx.fillRect(
   x-35,
   y,
   70,
   120
  );
 }
}


/* POLICE */

function drawPolice(){

 let x=laneX(targetLane);

 let y=H-45;

 if(policeImg.complete){

  ctx.drawImage(
   policeImg,
   x-55,
   y,
   110,
   165
  );
 }
}


/* TRAIN */

function drawTrains(){

 for(let t of trains){

  let x=laneX(t.lane);

  let scale=
   0.45+
   Math.min(t.y/H,1)*.8;

  let w=110*scale;
  let h=150*scale;

  ctx.fillStyle="#df2929";

  ctx.fillRect(
   x-w/2,
   t.y,
   w,
   h
  );

  ctx.fillStyle="#8de4ff";

  ctx.fillRect(
   x-w*.3,
   t.y+h*.2,
   w*.6,
   h*.25
  );

  ctx.fillStyle="#ffd21c";

  ctx.beginPath();

  ctx.arc(
   x,
   t.y+h*.8,
   10*scale,
   0,
   Math.PI*2
  );

  ctx.fill();
 }
}


/* COINS */

function drawCoins(){

 for(let c of coinList){

  let x=laneX(c.lane);

  c.spin+=.15;

  let size=
   18+
   Math.sin(c.spin)*4;

  ctx.fillStyle="#ffd21c";

  ctx.beginPath();

  ctx.arc(
   x,
   c.y,
   size,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.font="bold 18px Arial";

  ctx.textAlign="center";

  ctx.fillText(
   "₹",
   x,
   c.y+6
  );
 }
}


/* UPDATE */

function update(){

 /* lane */

 if(
  Math.abs(targetLane-lane)<.01
 ){
  lane=targetLane;
 }


 /* jump */

 if(jump>0){

  jump+=jumpSpeed;

  jumpSpeed-=1;

  if(jump<=0){
   jump=0;
   jumpSpeed=0;
  }
 }


 /* trains */

 for(let t of trains){

  t.y+=speed;

  let px=laneX(targetLane);

  let tx=laneX(t.lane);

  if(
   Math.abs(px-tx)<65 &&
   t.y>H-260 &&
   t.y<H-80 &&
   jump<100
  ){
   gameOver();
  }
 }


 trains=
 trains.filter(t=>t.y<H+200);


 /* coins */

 for(let c of coinList){

  c.y+=speed;

  let px=laneX(targetLane);

  let cx=laneX(c.lane);

  if(
   Math.abs(px-cx)<60 &&
   c.y>H-250 &&
   c.y<H-80
  ){

   coins++;
   score+=25;

   c.y=H+500;
  }
 }

 coinList=
 coinList.filter(c=>c.y<H+100);


 /* spawning */

 spawnTimer--;

 coinTimer--;

 if(spawnTimer<=0){

  addTrain();

  spawnTimer=
   45+
   Math.random()*45;
 }

 if(coinTimer<=0){

  addCoin();

  coinTimer=
   30+
   Math.random()*30;
 }


 score+=.1;

 speed+=.001;


 document.getElementById("score")
 .textContent=Math.floor(score);

 document.getElementById("coins")
 .textContent=coins;


 document.getElementById("mission")
 .textContent=
 "🎯 Mission: 20 Coins ("+
 coins+
 "/20)";
}


/* LOOP */

function loop(){

 if(!playing)return;

 update();

 drawRoad();

 drawTrains();

 drawCoins();

 drawPolice();

 drawPlayer();

 requestAnimationFrame(loop);
}


/* INITIAL SCREEN */

drawRoad();

</script>

</body>
</html>
