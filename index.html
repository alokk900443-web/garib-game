<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Cartoon Police Chase 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#65c9ff;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  color:white;
  font-size:19px;
  font-weight:900;
  text-shadow:2px 3px 5px #000;
}

#mission{
  position:fixed;
  top:52px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:#222d;
  color:#fff;
  padding:9px 16px;
  border-radius:20px;
  font-weight:bold;
  white-space:nowrap;
}

#controls{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
}

.btn{
  width:72px;
  height:62px;
  border:3px solid #222;
  border-radius:20px;
  background:#fff;
  font-size:29px;
  box-shadow:0 5px 12px #0008;
}

#jump{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:18px;
}

.screen{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000b;
  color:#fff;
  text-align:center;
}

.box{
  width:90%;
  max-width:380px;
  background:#171717;
  border:3px solid #ffd21c;
  padding:24px;
  border-radius:28px;
  box-shadow:0 10px 40px #000;
}

.play{
  width:100%;
  padding:15px;
  border:0;
  border-radius:16px;
  background:#ffd21c;
  color:#111;
  font-size:20px;
  font-weight:900;
}

#gameOver{
  display:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div>🏆 <span id="score">0</span></div>
  <div>🪙 <span id="coins">0</span></div>
</div>

<div id="mission">
🎯 मिशन: 20 Coins जमा करो
</div>

<div id="controls">
  <button class="btn" id="left">⬅️</button>
  <button class="btn" id="jump">⬆️</button>
  <button class="btn" id="right">➡️</button>
</div>

<div class="screen" id="startScreen">
  <div class="box">
    <h1>🏃‍♂️ CARTOON RUNNER</h1>

    <p>
      🚆 ट्रेन से बचो<br>
      🌳 पेड़ों के बीच दौड़ो<br>
      🪙 Coins जमा करो<br>
      👮 Police से बचो
    </p>

    <p>
      आपका character अपने-आप लगाया जाएगा।
    </p>

    <button class="play" id="start">
      ▶️ GAME START
    </button>
  </div>
</div>

<div class="screen" id="gameOver">
  <div class="box">
    <h1>🚨 GAME OVER</h1>

    <p>👮 Police ने पकड़ लिया!</p>

    <p>🏆 Score: <b id="finalScore">0</b></p>
    <p>🪙 Coins: <b id="finalCoins">0</b></p>

    <button class="play" id="restart">
      🔄 फिर से खेलें
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =================================================
   3D CARTOON GAME
================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x65c9ff);

scene.fog = new THREE.Fog(
  0x65c9ff,
  35,
  170
);


/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  0.1,
  300
);

camera.position.set(0,6,12);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

document
.getElementById("game")
.appendChild(renderer.domElement);


/* LIGHT */

const skyLight =
new THREE.HemisphereLight(
  0xffffff,
  0x548044,
  2.5
);

scene.add(skyLight);


const sun =
new THREE.DirectionalLight(
  0xffffff,
  2.2
);

sun.position.set(
  -20,30,20
);

sun.castShadow=true;

scene.add(sun);


/* =================================================
   ROAD
================================================= */

const road =
new THREE.Mesh(
  new THREE.BoxGeometry(
    18,
    0.25,
    240
  ),
  new THREE.MeshStandardMaterial({
    color:0x303030,
    roughness:1
  })
);

road.position.set(
  0,
  -0.15,
  -75
);

road.receiveShadow=true;

scene.add(road);


/* GRASS */

const grass =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    250,
    300
  ),
  new THREE.MeshStandardMaterial({
    color:0x4e9b42
  })
);

grass.rotation.x=
-Math.PI/2;

grass.position.set(
  0,
  -0.3,
  -75
);

scene.add(grass);


/* LANE LINES */

for(const x of [-3,3]){

  const line =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      0.12,
      0.04,
      240
    ),
    new THREE.MeshStandardMaterial({
      color:0xffffff
    })
  );

  line.position.set(
    x,
    0.02,
    -75
  );

  scene.add(line);
}


/* ROAD EDGES */

for(const x of [-9,9]){

  const edge =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      0.3,
      0.08,
      240
    ),
    new THREE.MeshStandardMaterial({
      color:0xffffff
    })
  );

  edge.position.set(
    x,
    0.03,
    -75
  );

  scene.add(edge);
}


/* =================================================
   CARTOON TREES
================================================= */

const trees=[];

function makeTree(x,z){

  const tree =
  new THREE.Group();


  /* trunk */

  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35,
      .5,
      3,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x70452d
    })
  );

  trunk.position.y=1.5;

  tree.add(trunk);


  /* cartoon leaves */

  for(let i=0;i<4;i++){

    const leaf =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.25,
        12,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:
          i%2
          ? 0x159447
          : 0x27ad4b
      })
    );

    leaf.position.set(
      (i%2)*1-0.5,
      3+i*.35,
      (i%2)*.5
    );

    tree.add(leaf);

  }


  tree.position.set(
    x,
    0,
    z
  );

  scene.add(tree);

  trees.push(tree);
}


/* दोनों तरफ बहुत सारे पेड़ */

for(
  let z=-10;
  z>-210;
  z-=12
){

  makeTree(
    -13-Math.random()*4,
    z
  );

  makeTree(
    13+Math.random()*4,
    z-5
  );
}


/* =================================================
   CHARACTER
================================================= */

const loader =
new THREE.TextureLoader();

const playerTexture =
loader.load(
  "character.jpg"
);

const policeTexture =
loader.load(
  "police.png"
);


const playerMaterial =
new THREE.SpriteMaterial({
  map:playerTexture,
  transparent:true
});

const policeMaterial =
new THREE.SpriteMaterial({
  map:policeTexture,
  transparent:true
});


const player =
new THREE.Sprite(
  playerMaterial
);

player.scale.set(
  4,
  6,
  1
);

player.position.set(
  0,
  3,
  5
);

scene.add(player);


const police =
new THREE.Sprite(
  policeMaterial
);

police.scale.set(
  3.3,
  5,
  1
);

police.position.set(
  0,
  2.5,
  -5
);

scene.add(police);


/* =================================================
   LANES
================================================= */

const lanes=[
  -6,
  0,
  6
];

let currentLane=1;
let targetLane=1;


/* =================================================
   JUMP
================================================= */

let jumpY=0;
let jumpVelocity=0;


/* =================================================
   GAME VARIABLES
================================================= */

let playing=false;

let score=0;
let coins=0;

let speed=.55;

let policeDistance=0;

let trains=[];
let coinObjects=[];


/* =================================================
   TRAIN
================================================= */

function createTrain(){

  const lane=
  Math.floor(
    Math.random()*3
  );

  const train =
  new THREE.Group();


  /* body */

  const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      4,
      3.2,
      7
    ),
    new THREE.MeshStandardMaterial({
      color:0xe02d2d
    })
  );

  body.position.y=1.6;

  train.add(body);


  /* roof */

  const roof =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      4.3,
      .35,
      7.3
    ),
    new THREE.MeshStandardMaterial({
      color:0x222222
    })
  );

  roof.position.y=3.35;

  train.add(roof);


  /* windows */

  for(
    const z of [-2.2,0,2.2]
  ){

    const windowMesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        3,
        1,
        .12
      ),
      new THREE.MeshStandardMaterial({
        color:0x91e8ff
      })
    );

    windowMesh.position.set(
      0,
      2.1,
      z
    );

    train.add(windowMesh);

  }


  /* front light */

  const light =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .3,
      12,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0xffe600
    })
  );

  light.position.set(
    0,
    1,
    3.55
  );

  train.add(light);


  train.position.set(
    lanes[lane],
    0,
    -100
  );

  scene.add(train);

  trains.push({
    object:train,
    lane:lane
  });
}


/* =================================================
   COIN
================================================= */

function createCoin(){

  const lane=
  Math.floor(
    Math.random()*3
  );

  const coin =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .7,
      .7,
      .2,
      24
    ),
    new THREE.MeshStandardMaterial({
      color:0xffd21c,
      metalness:.5
    })
  );

  coin.rotation.x=
  Math.PI/2;

  coin.position.set(
    lanes[lane],
    1.6,
    -80
  );

  scene.add(coin);

  coinObjects.push({
    object:coin,
    lane:lane
  });
}


/* =================================================
   GAME START
================================================= */

function startGame(){

  playing=true;

  score=0;
  coins=0;

  speed=.55;

  currentLane=1;
  targetLane=1;

  jumpY=0;
  jumpVelocity=0;

  policeDistance=0;


  /* पुराने objects हटाएँ */

  trains.forEach(
    t=>scene.remove(t.object)
  );

  coinObjects.forEach(
    c=>scene.remove(c.object)
  );

  trains=[];
  coinObjects=[];


  document
  .getElementById("startScreen")
  .style.display="none";

  document
  .getElementById("gameOver")
  .style.display="none";
}


/* =================================================
   CONTROLS
================================================= */

function left(){

  if(!playing)return;

  targetLane--;

  if(targetLane<0)
    targetLane=0;
}


function right(){

  if(!playing)return;

  targetLane++;

  if(targetLane>2)
    targetLane=2;
}


function jump(){

  if(
    !playing ||
    jumpY>0
  ) return;

  jumpY=.1;

  jumpVelocity=.43;
}


/* BUTTONS */

document
.getElementById("left")
.onclick=left;

document
.getElementById("right")
.onclick=right;

document
.getElementById("jump")
.onclick=jump;

document
.getElementById("start")
.onclick=startGame;

document
.getElementById("restart")
.onclick=startGame;


/* KEYBOARD */

document.addEventListener(
"keydown",
function(e){

  if(e.key==="ArrowLeft")
    left();

  if(e.key==="ArrowRight")
    right();

  if(
    e.key==="ArrowUp" ||
    e.code==="Space"
  )
    jump();
});


/* =================================================
   TOUCH SWIPE
================================================= */

let touchX=0;
let touchY=0;

renderer.domElement.addEventListener(
"touchstart",
function(e){

  touchX=
  e.touches[0].clientX;

  touchY=
  e.touches[0].clientY;

},
{passive:true}
);


renderer.domElement.addEventListener(
"touchend",
function(e){

  if(!playing)return;

  const x=
  e.changedTouches[0].clientX;

  const y=
  e.changedTouches[0].clientY;

  const dx=x-touchX;
  const dy=y-touchY;


  if(
    Math.abs(dx)>
    Math.abs(dy)
  ){

    if(dx>40)
      right();

    if(dx<-40)
      left();

  }else{

    if(dy<-40)
      jump();

  }

},
{passive:true}
);


/* =================================================
   UPDATE PLAYER
================================================= */

function updatePlayer(){

  const wanted=
  lanes[targetLane];

  player.position.x +=
  (
    wanted-
    player.position.x
  )*.15;


  /* jump */

  if(jumpY>0){

    jumpY+=jumpVelocity;

    jumpVelocity-=.025;

    if(jumpY<=0){

      jumpY=0;
      jumpVelocity=0;
    }
  }


  player.position.y=
  3+jumpY;


  /* cartoon running bounce */

  if(playing){

    player.position.y +=
    Math.sin(
      Date.now()*.018
    )*.08;

  }
}


/* =================================================
   POLICE CHASE
================================================= */

function updatePolice(){

  police.position.x +=
  (
    player.position.x-
    police.position.x
  )*.08;


  policeDistance+=.004;


  police.position.z=
  -5+
  policeDistance;


  /* police थोड़ा animation */

  police.position.y=
  2.5+
  Math.sin(
    Date.now()*.018
  )*.05;


  if(
    policeDistance>9
  ){

    gameOver();
  }
}


/* =================================================
   UPDATE TRAIN
================================================= */

function updateTrains(){

  for(
    let i=trains.length-1;
    i>=0;
    i--
  ){

    const t=
    trains[i];

    t.object.position.z+=
    speed;


    const dx=
    Math.abs(
      t.object.position.x-
      player.position.x
    );

    const dz=
    Math.abs(
      t.object.position.z-
      player.position.z
    );


    /* collision */

    if(
      dx<2.8 &&
      dz<4 &&
      jumpY<2.3
    ){

      gameOver();

      return;
    }


    if(
      t.object.position.z>20
    ){

      scene.remove(
        t.object
      );

      trains.splice(
        i,
        1
      );
    }
  }
}


/* =================================================
   UPDATE COINS
================================================= */

function updateCoins(){

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const c=
    coinObjects[i];

    c.object.position.z+=
    speed;

    c.object.rotation.z+=.08;


    const dx=
    Math.abs(
      c.object.position.x-
      player.position.x
    );

    const dz=
    Math.abs(
      c.object.position.z-
      player.position.z
    );


    if(
      dx<2.3 &&
      dz<2.5
    ){

      coins++;
      score+=25;

      scene.remove(
        c.object
      );

      coinObjects.splice(
        i,
        1
      );

      continue;
    }


    if(
      c.object.position.z>20
    ){

      scene.remove(
        c.object
      );

      coinObjects.splice(
        i,
        1
      );
    }
  }
}


/* =================================================
   MISSION
================================================= */

function updateMission(){

  const m=
  document.getElementById(
    "mission"
  );


  if(coins<20){

    m.textContent=
    "🎯 Mission: 20 Coins ("+
    coins+
    "/20)";

  }else if(score<1000){

    m.textContent=
    "🎯 Mission: 1000 Score";

  }else{

    m.textContent=
    "🏆 Mission Complete!";
  }
}


/* =================================================
   GAME OVER
================================================= */

function gameOver(){

  if(!playing)return;

  playing=false;


  document
  .getElementById(
    "finalScore"
  )
  .textContent=
  Math.floor(score);


  document
  .getElementById(
    "finalCoins"
  )
  .textContent=
  coins;


  document
  .getElementById(
    "gameOver"
  )
  .style.display="flex";
}


/* =================================================
   SPAWN
================================================= */

let trainTimer=20;
let coinTimer=10;

function spawnObjects(){

  trainTimer-=speed;

  coinTimer-=speed;


  if(trainTimer<=0){

    createTrain();

    trainTimer=
    45+
    Math.random()*30;
  }


  if(coinTimer<=0){

    createCoin();

    coinTimer=
    18+
    Math.random()*18;
  }
}


/* =================================================
   ANIMATION
================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(playing){

    spawnObjects();

    updatePlayer();

    updatePolice();

    updateTrains();

    updateCoins();

    score+=.08;

    speed+=.0002;

    document
    .getElementById("score")
    .textContent=
    Math.floor(score);

    document
    .getElementById("coins")
    .textContent=
    coins;

    updateMission();
  }


  /* CAMERA */

  camera.position.x +=
  (
    player.position.x*.15-
    camera.position.x
  )*.04;


  camera.position.y=6;

  camera.lookAt(
    player.position.x,
    2,
    -18
  );


  renderer.render(
    scene,
    camera
  );
}

animate();


/* =================================================
   RESIZE
================================================= */

window.addEventListener(
"resize",
function(){

  camera.aspect=
  innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});

</script>

</body>
  </html>
