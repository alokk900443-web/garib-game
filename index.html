<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>3D Police Chase Runner</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#78d5ff;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  color:white;
  font-size:20px;
  font-weight:bold;
  text-shadow:2px 2px 5px #000;
}

#mission{
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:#111d;
  color:white;
  padding:10px 18px;
  border-radius:18px;
  text-align:center;
  font-weight:bold;
}

#controls{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
}

.btn{
  width:78px;
  height:65px;
  border:0;
  border-radius:20px;
  background:#ffffffdd;
  font-size:30px;
  box-shadow:0 5px 15px #0007;
}

#jump{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
}

.screen{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000b;
  color:white;
  text-align:center;
}

.box{
  width:90%;
  max-width:380px;
  background:#171717;
  padding:22px;
  border-radius:25px;
}

.mainBtn,
.fileBtn{
  width:100%;
  display:block;
  padding:14px;
  margin:10px 0;
  border:0;
  border-radius:15px;
  font-size:18px;
  font-weight:bold;
}

.mainBtn{
  background:#ffd21c;
}

.fileBtn{
  background:#287fff;
  color:white;
}

input[type=file]{
  display:none;
}

#gameOver{
  display:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div>🏆 Score: <span id="score">0</span></div>
  <div>🪙 Coins: <span id="coins">0</span></div>
</div>

<div id="mission">
🎯 Mission: 20 Coins (0/20)
</div>

<div id="controls">
  <button class="btn" id="left">⬅️</button>
  <button class="btn" id="jump">⬆️</button>
  <button class="btn" id="right">➡️</button>
</div>


<div class="screen" id="startScreen">

<div class="box">

<h1>🏃‍♂️ 3D POLICE CHASE</h1>

<p>ट्रेन से बचो और Coins जमा करो!</p>

<label class="fileBtn">
🏃 अपना Character चुनें
<input id="characterFile"
type="file"
accept="image/*">
</label>

<p id="characterStatus">
❌ Character नहीं चुना
</p>

<label class="fileBtn">
👮 Police Character चुनें
<input id="policeFile"
type="file"
accept="image/*">
</label>

<p id="policeStatus">
❌ Police नहीं चुना
</p>

<button class="mainBtn"
id="startButton">
▶️ START 3D GAME
</button>

</div>
</div>


<div class="screen" id="gameOver">

<div class="box">

<h1>🚨 GAME OVER</h1>

<p>👮 पुलिस ने पकड़ लिया!</p>

<p>🏆 Score:
<span id="finalScore">0</span>
</p>

<p>🪙 Coins:
<span id="finalCoins">0</span>
</p>

<button class="mainBtn"
id="restart">
🔄 फिर से खेलें
</button>

</div>
</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =========================
BASIC 3D
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x69c9f5);

scene.fog =
new THREE.Fog(0x69c9f5,30,180);


const camera =
new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.1,
300
);

camera.position.set(
0,6,12
);


const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.setSize(
innerWidth,
innerHeight
);

renderer.shadowMap.enabled=true;

document
.getElementById("game")
.appendChild(renderer.domElement);


/* =========================
LIGHT
========================= */

const ambient =
new THREE.HemisphereLight(
0xffffff,
0x557744,
2
);

scene.add(ambient);


const sun =
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
-20,30,20
);

sun.castShadow=true;

scene.add(sun);


/* =========================
ROAD
========================= */

const road =
new THREE.Mesh(
new THREE.BoxGeometry(
18,
0.2,
220
),
new THREE.MeshStandardMaterial({
color:0x292929
})
);

road.position.set(
0,-0.15,-70
);

road.receiveShadow=true;

scene.add(road);


/* ROAD SIDES */

function sideLine(x){

const line =
new THREE.Mesh(
new THREE.BoxGeometry(
0.3,
0.05,
220
),
new THREE.MeshStandardMaterial({
color:0xffffff
})
);

line.position.set(
x,0,-70
);

scene.add(line);

}

sideLine(-9);
sideLine(9);


/* LANE LINES */

for(let x of [-3,3]){

const line =
new THREE.Mesh(
new THREE.BoxGeometry(
0.12,
0.04,
220
),
new THREE.MeshStandardMaterial({
color:0xffffff
})
);

line.position.set(
x,0.03,-70
);

scene.add(line);

}


/* =========================
GROUND
========================= */

const ground =
new THREE.Mesh(
new THREE.PlaneGeometry(
250,300
),
new THREE.MeshStandardMaterial({
color:0x4d983e
})
);

ground.rotation.x=
-Math.PI/2;

ground.position.y=-0.2;

ground.position.z=-70;

scene.add(ground);


/* =========================
IMAGE SYSTEM
========================= */

let playerTexture=null;
let policeTexture=null;

let playerReady=false;
let policeReady=false;


/*
White background remover.
*/
function removeWhite(img){

const c=
document.createElement("canvas");

c.width=img.width;
c.height=img.height;

const ctx=
c.getContext("2d");

ctx.drawImage(
img,0,0
);

const data=
ctx.getImageData(
0,0,c.width,c.height
);

for(
let i=0;
i<data.data.length;
i+=4
){

const r=data.data[i];
const g=data.data[i+1];
const b=data.data[i+2];

if(
r>225 &&
g>225 &&
b>225
){

data.data[i+3]=0;

}

}

ctx.putImageData(
data,0,0
);

return new THREE.CanvasTexture(c);
}


/* =========================
PHOTO SELECT
========================= */

document
.getElementById("characterFile")
.addEventListener(
"change",
function(){

const file=this.files[0];

if(!file)return;

const img=
new Image();

img.onload=function(){

playerTexture=
removeWhite(img);

playerReady=true;

document
.getElementById(
"characterStatus"
)
.textContent=
"✅ Character तैयार है";

};

img.src=
URL.createObjectURL(file);

});


document
.getElementById("policeFile")
.addEventListener(
"change",
function(){

const file=this.files[0];

if(!file)return;

const img=
new Image();

img.onload=function(){

policeTexture=
removeWhite(img);

policeReady=true;

document
.getElementById(
"policeStatus"
)
.textContent=
"✅ Police तैयार है";

};

img.src=
URL.createObjectURL(file);

});


/* =========================
SPRITE CREATOR
========================= */

function makeCharacter(texture){

const material =
new THREE.SpriteMaterial({
map:texture,
transparent:true,
depthWrite:false
});

const sprite =
new THREE.Sprite(material);

sprite.scale.set(
4,
6,
1
);

sprite.castShadow=true;

return sprite;

}


/* =========================
PLAYER
========================= */

let player=null;

let lane=1;
let targetLane=1;

const laneX=[
-6,0,6
];

let jumpY=0;
let jumpVelocity=0;


/* =========================
POLICE
========================= */

let police=null;

let policeDistance=14;


/* =========================
COINS
========================= */

let coinObjects=[];


/* =========================
TRAINS
========================= */

let trainObjects=[];


/* =========================
TREES
========================= */

let treeObjects=[];


/* =========================
CREATE TREE
========================= */

function createTree(x,z){

const group=
new THREE.Group();


const trunk =
new THREE.Mesh(
new THREE.CylinderGeometry(
0.35,
0.45,
3,
8
),
new THREE.MeshStandardMaterial({
color:0x70452c
})
);

trunk.position.y=1.5;

group.add(trunk);


for(let i=0;i<3;i++){

const leaf =
new THREE.Mesh(
new THREE.SphereGeometry(
1.5,
12,
12
),
new THREE.MeshStandardMaterial({
color:0x17813a
})
);

leaf.position.set(
(i-1)*0.7,
3+i*.55,
0
);

group.add(leaf);

}

group.position.set(
x,0,z
);

scene.add(group);

treeObjects.push(group);

}


/* TREES */

for(let z=-10;z>-190;z-=12){

createTree(
-13-Math.random()*3,
z
);

createTree(
13+Math.random()*3,
z-5
);

}


/* =========================
CREATE TRAIN
========================= */

function createTrain(laneNumber,z){

const group=
new THREE.Group();


const body =
new THREE.Mesh(
new THREE.BoxGeometry(
4.2,
3,
8
),
new THREE.MeshStandardMaterial({
color:0xd92727
})
);

body.position.y=1.6;

body.castShadow=true;

group.add(body);


const windowMat =
new THREE.MeshStandardMaterial({
color:0x8ee7ff
});


for(let z2 of [-2,2]){

const win =
new THREE.Mesh(
new THREE.BoxGeometry(
3,
1.1,
0.1
),
windowMat
);

win.position.set(
0,2.1,z2>0?4.01:-4.01
);

group.add(win);

}


group.position.set(
laneX[laneNumber],
0,
z
);

scene.add(group);

trainObjects.push(group);

}


/* =========================
CREATE COIN
========================= */

function createCoin(laneNumber,z){

const coin =
new THREE.Mesh(
new THREE.CylinderGeometry(
0.65,
0.65,
0.18,
32
),
new THREE.MeshStandardMaterial({
color:0xffd21c,
metalness:.6,
roughness:.25
})
);

coin.rotation.x=
Math.PI/2;

coin.position.set(
laneX[laneNumber],
1.4,
z
);

scene.add(coin);

coinObjects.push(coin);

}


/* =========================
GAME VARIABLES
========================= */

let running=false;

let score=0;
let coins=0;

let speed=0.55;

let spawnTimer=0;

let coinTimer=0;

let policeCatch=0;


/* =========================
START
========================= */

function startGame(){

if(!playerReady){

alert(
"पहले अपना Character चुनें!"
);

return;

}

if(!policeReady){

alert(
"पहले Police Character चुनें!"
);

return;

}


/* PLAYER */

if(player)
scene.remove(player);

player=
makeCharacter(
playerTexture
);

player.position.set(
0,3,5
);

scene.add(player);


/* POLICE */

if(police)
scene.remove(police);

police=
makeCharacter(
policeTexture
);

police.scale.set(
3.3,
5,
1
);

police.position.set(
0,2,-4
);

scene.add(police);


/* RESET */

score=0;
coins=0;

lane=1;
targetLane=1;

jumpY=0;
jumpVelocity=0;

speed=.55;

policeCatch=0;

running=true;


/* DELETE OLD */

for(let x of coinObjects)
scene.remove(x);

for(let x of trainObjects)
scene.remove(x);

coinObjects=[];
trainObjects=[];


/* SCREEN */

document
.getElementById(
"startScreen"
).style.display="none";

document
.getElementById(
"gameOver"
).style.display="none";

}


/* =========================
LANE
========================= */

function moveLeft(){

if(!running)return;

targetLane--;

if(targetLane<0)
targetLane=0;

}


function moveRight(){

if(!running)return;

targetLane++;

if(targetLane>2)
targetLane=2;

}


/* =========================
JUMP
========================= */

function jump(){

if(
!running ||
jumpY>0
)return;

jumpY=.1;

jumpVelocity=.42;

}


/* =========================
BUTTONS
========================= */

document
.getElementById("left")
.onclick=moveLeft;

document
.getElementById("right")
.onclick=moveRight;

document
.getElementById("jump")
.onclick=jump;

document
.getElementById("startButton")
.onclick=startGame;

document
.getElementById("restart")
.onclick=startGame;


/* =========================
KEYBOARD
========================= */

document.addEventListener(
"keydown",
e=>{

if(e.key==="ArrowLeft")
moveLeft();

if(e.key==="ArrowRight")
moveRight();

if(
e.key==="ArrowUp" ||
e.code==="Space"
)
jump();

});


/* =========================
SPAWN
========================= */

function spawnObjects(){

spawnTimer-=speed;

coinTimer-=speed;


if(spawnTimer<=0){

const l=
Math.floor(
Math.random()*3
);

createTrain(
l,
-100
);

spawnTimer=
45+
Math.random()*35;

}


if(coinTimer<=0){

const l=
Math.floor(
Math.random()*3
);

createCoin(
l,
-70
);

coinTimer=
18+
Math.random()*20;

}

}


/* =========================
PLAYER UPDATE
========================= */

function updatePlayer(){

const wantedX=
laneX[targetLane];

player.position.x +=
(
wantedX-
player.position.x
)*.15;


/* JUMP */

if(jumpY>0){

jumpY+=
jumpVelocity;

jumpVelocity-=.025;

if(jumpY<=0){

jumpY=0;
jumpVelocity=0;

}

}

player.position.y=
3+jumpY;


/* RUNNING ANIMATION */

player.rotation.z=
Math.sin(
Date.now()*.015
)*.025;

}


/* =========================
POLICE UPDATE
========================= */

function updatePolice(){

police.position.x +=
(
player.position.x-
police.position.x
)*.08;


policeCatch+=.004;


police.position.z=
-4+
policeCatch;


if(
policeCatch>8
){

endGame();

}

}


/* =========================
COIN UPDATE
========================= */

function updateCoins(){

for(
let i=coinObjects.length-1;
i>=0;
i--
){

const c=
coinObjects[i];

c.position.z+=speed;

c.rotation.z+=.08;


/* COLLECT */

const dx=
c.position.x-
player.position.x;

const dz=
c.position.z-
player.position.z;


if(
Math.abs(dx)<2.5 &&
Math.abs(dz)<2.5 &&
jumpY<4
){

coins++;
score+=30;

scene.remove(c);

coinObjects.splice(
i,1
);

continue;

}


/* DELETE */

if(
c.position.z>15
){

scene.remove(c);

coinObjects.splice(
i,1
);

}

}

}


/* =========================
TRAIN UPDATE
========================= */

function updateTrains(){

for(
let i=trainObjects.length-1;
i>=0;
i--
){

const t=
trainObjects[i];

t.position.z+=speed;


/* COLLISION */

const dx=
Math.abs(
t.position.x-
player.position.x
);

const dz=
Math.abs(
t.position.z-
player.position.z
);


if(
dx<3 &&
dz<4 &&
jumpY<2.5
){

endGame();

}


/* DELETE */

if(
t.position.z>20
){

scene.remove(t);

trainObjects.splice(
i,1
);

}

}

}


/* =========================
HUD
========================= */

function updateHUD(){

document
.getElementById("score")
.textContent=
Math.floor(score);

document
.getElementById("coins")
.textContent=
coins;


if(coins<20){

document
.getElementById("mission")
.textContent=
"🎯 Mission: 20 Coins ("+
coins+
"/20)";

}else{

document
.getElementById("mission")
.textContent=
"🏆 Mission Complete!";

}

}


/* =========================
GAME OVER
========================= */

function endGame(){

if(!running)return;

running=false;

document
.getElementById("finalScore")
.textContent=
Math.floor(score);

document
.getElementById("finalCoins")
.textContent=
coins;

document
.getElementById("gameOver")
.style.display="flex";

}


/* =========================
ANIMATION
========================= */

function animate(){

requestAnimationFrame(
animate
);

if(running){

spawnObjects();

updatePlayer();

updatePolice();

updateCoins();

updateTrains();

score+=.08;

speed+=.00025;

updateHUD();

}


/* CAMERA */

camera.position.x +=
(
player ?
player.position.x*.12 :
0
-
camera.position.x
)*.03;

camera.position.y=
6.2;

camera.lookAt(
player ?
player.position.x :
0,
2,
-18
);


renderer.render(
scene,
camera
);

}

animate();


/* =========================
RESIZE
========================= */

window.addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});


/* =========================
SWIPE
========================= */

let touchX=0;
let touchY=0;


renderer.domElement.addEventListener(
"touchstart",
e=>{

touchX=
e.touches[0].clientX;

touchY=
e.touches[0].clientY;

},
{passive:true}
);


renderer.domElement.addEventListener(
"touchend",
e=>{

const x=
e.changedTouches[0].clientX;

const y=
e.changedTouches[0].clientY;

const dx=x-touchX;
const dy=y-touchY;


if(
Math.abs(dx)>
Math.abs(dy)
){

if(dx>40)
moveRight();

if(dx<-40)
moveLeft();

}else{

if(dy<-40)
jump();

}

},
{passive:true}
);

</script>

</body>
</html>
