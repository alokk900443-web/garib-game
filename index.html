<!-- आगे-पीछे चलने के बटन -->
<div id="controls">
  <button class="btn" onclick="movePlayer(-40)">⬅️ पीछे</button>
  <button class="btn forward" onclick="movePlayer(100)">➡️ आगे बढ़ो</button>
</div>

<style>
#controls{
  position:fixed;
  z-index:350;
  bottom:15px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
}

.btn{
  height:60px;
  min-width:110px;
  padding:0 15px;
  border:0;
  border-radius:18px;
  background:#111;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.forward{
  min-width:160px;
  background:#ff9f1c;
  color:#111;
}

.btn:active{
  transform:scale(.92);
}
</style>

<script>
function movePlayer(amount){
  playerX += amount;

  playerX = Math.max(
    50,
    Math.min(4900, playerX)
  );

  updatePlayer();
  saveGame();
}
</script>
