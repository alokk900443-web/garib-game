<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Police Chase Runner</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#55bdf5;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  color:white;
  font-size:18px;
  font-weight:bold;
  text-shadow:2px 2px 5px #000;
}

#mission{
  position:fixed;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:#111d;
  color:white;
  padding:9px 15px;
  border-radius:15px;
  font-weight:bold;
  text-align:center;
}

#controls{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 25px;
}

.control{
  width:72px;
  height:60px;
  border:0;
  border-radius:18px;
  background:#ffffffdd;
  font-size:30px;
  box-shadow:0 4px 12px #0006;
}

#jump{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:18px;
  z-index:21;
}

.screen{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000b;
  color:white;
  text-align:center;
}

.box{
  width:90%;
  max-width:370px;
  background:#171717;
  padding:22px;
  border-radius:25px;
  box-shadow:0 10px 40px #000;
}

.box h1{
  margin-top:0;
}

.mainBtn{
  display:block;
  width:100%;
  margin:10px 0;
  padding:13px;
  border:0;
  border-radius:15px;
  font-size:18px;
  font-weight:bold;
  background:#ffd21c;
  color:#111;
}

.fileBtn{
  display:block;
  width:100%;
  margin:10px 0;
  padding:13px;
  border-radius:15px;
  background:#3287ff;
  color:white;
  font-weight:bold;
}

input[type=file]{
  display:none;
}

#gameOver{
  display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div>🏆 Score: <span id="score">0</span></div>
  <div>🪙 Coins: <span id="coins">0</span></div>
</div>

<div id="mission">
🎯 Mission: 20 Coins जमा करो
</div>


<!-- मोबाइल CONTROLS -->

<div id="controls">

  <button class="control" id="left">
    ⬅️
  </button>

  <button class="control" id="jump">
    ⬆️
  </button>

  <button class="control" id="right">
    ➡️
  </button>

</div>


<!-- START SCREEN -->

<div class="screen" id="startScreen">

<div class="box">

<h1>🏃 POLICE CHASE</h1>

<p>
ट्रेन से बचो और पुलिस से भागो!
</p>

<label class="fileBtn">
🏃 अपना Character चुनें
<input
type="file"
id="characterFile"
accept="image/*">
</label>

<p id="characterName">
❌ Character नहीं चुना
</p>


<label class="fileBtn">
👮 Police Character चुनें
<input
type="file"
id="policeFile"
accept="image/*">
</label>

<p id="policeName">
❌ Police नहीं चुना
</p>


<button
class="mainBtn"
id="startButton">
▶️ START GAME
</button>

<p style="font-size:13px;opacity:.7">
पहले दोनों फोटो चुनें, फिर START दबाएँ।
</p>

</div>

</div>


<!-- GAME OVER -->

<div class="screen" id="gameOver">

<div class="box">

<h1>🚨 GAME OVER</h1>

<p>👮 पुलिस ने पकड़ लिया!</p>

<p>
🏆 Score:
<b id="finalScore">0</b>
</p>

<p>
🪙 Coins:
<b id="finalCoins">0</b>
</p>

<button
class="mainBtn"
id="restart">
🔄 फिर से खेलें
</button>

</div>

</div>


<script>

/* =========================
CANVAS
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

}

resize();

window.addEventListener(
"resize",
resize
);


/* =========================
IMAGES
========================= */

let playerImage=new Image();
let policeImage=new Image();

let playerReady=false;
let policeReady=false;


/* =========================
PHOTO SELECT
========================= */

document
.getElementById("characterFile")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  playerImage.src=
  URL.createObjectURL(file);

  playerReady=true;

  document.getElementById(
    "characterName"
  ).textContent=
  "✅ Character तैयार है";

});


document
.getElementById("policeFile")
.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  policeImage.src=
  URL.createObjectURL(file);

  policeReady=true;

  document.getElementById(
    "policeName"
  ).textContent=
  "✅ Police तैयार है";

});


/* =========================
GAME VARIABLES
========================= */

let running=false;

let lane=1;
let targetLane=1;

let jump=0;
let jumpVelocity=0;

let score=0;
let coins=0;

let speed=6;

let policeDistance=145;

let obstacles=[];
let coinList=[];
let trees=[];

let obstacleTimer=0;
let coinTimer=0;
let treeTimer=0;


/* =========================
LANE
========================= */

function laneX(n){

  const left=W*.15;
  const width=W*.70;

  return left+
  width*(n+.5)/3;

}


/* =========================
WORLD
========================= */

function drawWorld(){

  /* SKY */

  let sky=
  ctx.createLinearGradient(
    0,0,0,H
  );

  sky.addColorStop(
    0,
    "#46b9f5"
  );

  sky.addColorStop(
    .55,
    "#c8f0ff"
  );

  sky.addColorStop(
    1,
    "#62ad45"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,H
  );


  /* HILLS */

  ctx.fillStyle="#579b48";

  ctx.beginPath();

  ctx.moveTo(0,H*.42);

  ctx.lineTo(W*.18,H*.20);

  ctx.lineTo(W*.35,H*.40);

  ctx.lineTo(W*.52,H*.18);

  ctx.lineTo(W*.72,H*.40);

  ctx.lineTo(W*.86,H*.22);

  ctx.lineTo(W,H*.40);

  ctx.lineTo(W,H);

  ctx.lineTo(0,H);

  ctx.closePath();

  ctx.fill();


  /* ROAD */

  ctx.fillStyle="#303030";

  ctx.beginPath();

  ctx.moveTo(W*.35,0);
  ctx.lineTo(W*.65,0);
  ctx.lineTo(W*.95,H);
  ctx.lineTo(W*.05,H);

  ctx.closePath();

  ctx.fill();


  /* ROAD EDGES */

  ctx.strokeStyle="white";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(W*.35,0);
  ctx.lineTo(W*.05,H);

  ctx.moveTo(W*.65,0);
  ctx.lineTo(W*.95,H);

  ctx.stroke();


  /* THREE LANES */

  ctx.strokeStyle="#ddd";
  ctx.lineWidth=3;

  for(let i=1;i<3;i++){

    ctx.beginPath();

    ctx.moveTo(
      W*.35+(W*.30/3)*i,
      0
    );

    ctx.lineTo(
      W*.05+(W*.90/3)*i,
      H
    );

    ctx.stroke();

  }

}


/* =========================
TREES
========================= */

function makeTree(){

  const leftSide=
  Math.random()<.5;

  trees.push({

    x:leftSide
      ? Math.random()*W*.22
      : W*.78+
        Math.random()*W*.22,

    y:-80,

    size:
      30+
      Math.random()*35

  });

}


function drawTrees(){

  for(let t of trees){

    t.y+=speed*.55;

    /* trunk */

    ctx.fillStyle="#70472c";

    ctx.fillRect(
      t.x-5,
      t.y,
      10,
      t.size
    );


    /* leaves */

    ctx.fillStyle="#167c38";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      t.size*.55,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#249b43";

    ctx.beginPath();

    ctx.arc(
      t.x-14,
      t.y+8,
      t.size*.32,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  trees=
  trees.filter(
    t=>t.y<H+100
  );

}


/* =========================
PLAYER
========================= */

function drawPlayer(){

  const x=
  laneX(lane);

  const y=
  H*.80-jump;

  const size=
  Math.min(
    W*.30,
    175
  );


  if(playerReady){

    ctx.save();

    ctx.shadowColor="#0009";
    ctx.shadowBlur=12;

    ctx.drawImage(
      playerImage,
      x-size/2,
      y-size*1.4,
      size,
      size*1.4
    );

    ctx.restore();

  }
}


/* =========================
POLICE
========================= */

function drawPolice(){

  const x=
  laneX(lane);

  const y=
  H*.80+
  policeDistance;

  const size=
  Math.min(
    W*.24,
    145
  );


  if(policeReady){

    ctx.save();

    ctx.shadowColor="#0009";
    ctx.shadowBlur=12;

    ctx.drawImage(
      policeImage,
      x-size/2,
      y-size*1.35,
      size,
      size*1.35
    );

    ctx.restore();

  }

}


/* =========================
TRAIN
========================= */

function createObstacle(){

  obstacles.push({

    lane:
    Math.floor(
      Math.random()*3
    ),

    y:-120,

    train:
    Math.random()<.75

  });

}


function drawObstacles(){

  for(let o of obstacles){

    o.y+=speed;

    const x=
    laneX(o.lane);


    if(o.train){

      /* TRAIN */

      ctx.fillStyle="#d92828";

      ctx.fillRect(
        x-40,
        o.y,
        80,
        110
      );


      ctx.fillStyle="#9ee8ff";

      ctx.fillRect(
        x-28,
        o.y+18,
        56,
        28
      );


      ctx.fillStyle="#ffd900";

      ctx.beginPath();

      ctx.arc(
        x,
        o.y+88,
        9,
        0,
        Math.PI*2
      );

      ctx.fill();


    }else{

      /* BARRIER */

      ctx.fillStyle="#f0a800";

      ctx.fillRect(
        x-40,
        o.y,
        80,
        45
      );

    }

  }


  obstacles=
  obstacles.filter(
    o=>o.y<H+150
  );

}


/* =========================
COINS
========================= */

function createCoin(){

  coinList.push({

    lane:
    Math.floor(
      Math.random()*3
    ),

    y:-40

  });

}


function drawCoins(){

  for(let c of coinList){

    c.y+=speed;

    const x=
    laneX(c.lane);


    ctx.fillStyle="#ffd21c";

    ctx.beginPath();

    ctx.arc(
      x,
      c.y,
      14,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#fff5a5";

    ctx.font=
    "bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "₹",
      x,
      c.y+5
    );

  }


  coinList=
  coinList.filter(
    c=>c.y<H+60
  );

}


/* =========================
COLLISION
========================= */

function checkCollision(){

  const py=
  H*.80-jump;


  for(let i=
      obstacles.length-1;
      i>=0;
      i--){

    const o=
    obstacles[i];


    if(
      o.lane===Math.round(lane)&&
      Math.abs(o.y-py)<75&&
      jump<50
    ){

      endGame();

      return;

    }

  }


  /* COIN */

  for(let i=
      coinList.length-1;
      i>=0;
      i--){

    const c=
    coinList[i];


    if(
      c.lane===Math.round(lane)&&
      Math.abs(c.y-py)<60
    ){

      coins++;

      score+=20;

      coinList.splice(
        i,
        1
      );

    }

  }

}


/* =========================
POLICE
========================= */

function policeChase(){

  policeDistance-=0.012;

  if(
    policeDistance<48
  ){

    endGame();

  }

}


/* =========================
MISSION
========================= */

function missionUpdate(){

  const m=
  document.getElementById(
    "mission"
  );


  if(coins<20){

    m.textContent=
    "🎯 Mission: 20 Coins जमा करो ("+
    coins+
    "/20)";

  }else if(score<1000){

    m.textContent=
    "🎯 Mission: 1000 Score पूरा करो";

  }else{

    m.textContent=
    "🏆 Mission Complete!";

  }

}


/* =========================
GAME OVER
========================= */

function endGame(){

  if(!running)return;

  running=false;

  document.getElementById(
    "finalScore"
  ).textContent=
  Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
  coins;

  document.getElementById(
    "gameOver"
  ).style.display="flex";

}


/* =========================
START
========================= */

function startGame(){

  if(!playerReady){

    alert(
      "पहले अपना Character फोटो चुनें!"
    );

    return;

  }


  if(!policeReady){

    alert(
      "पहले Police Character फोटो चुनें!"
    );

    return;

  }


  running=true;

  score=0;
  coins=0;

  lane=1;
  targetLane=1;

  jump=0;
  jumpVelocity=0;

  speed=6;

  policeDistance=145;

  obstacles=[];
  coinList=[];
  trees=[];

  obstacleTimer=20;
  coinTimer=10;
  treeTimer=0;


  document.getElementById(
    "startScreen"
  ).style.display="none";

  document.getElementById(
    "gameOver"
  ).style.display="none";


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================
GAME LOOP
========================= */

function gameLoop(){

  if(!running)return;


  ctx.clearRect(
    0,0,W,H
  );


  drawWorld();


  /* TREES */

  treeTimer--;

  if(treeTimer<=0){

    makeTree();

    treeTimer=
    25+
    Math.random()*25;

  }

  drawTrees();


  /* OBSTACLES */

  obstacleTimer--;

  if(obstacleTimer<=0){

    createObstacle();

    obstacleTimer=
    65-
    Math.min(
      20,
      speed
    );

  }


  /* COINS */

  coinTimer--;

  if(coinTimer<=0){

    createCoin();

    coinTimer=
    25+
    Math.random()*20;

  }


  /* LANE */

  lane+=
  (targetLane-lane)
  *.20;


  /* JUMP */

  if(
    jump>0||
    jumpVelocity!==0
  ){

    jump+=
    jumpVelocity;

    jumpVelocity-=1;


    if(jump<=0){

      jump=0;
      jumpVelocity=0;

    }

  }


  drawObstacles();

  drawCoins();


  checkCollision();

  policeChase();


  drawPolice();

  drawPlayer();


  score+=.12;

  speed+=.0006;


  document.getElementById(
    "score"
  ).textContent=
  Math.floor(score);


  document.getElementById(
    "coins"
  ).textContent=
  coins;


  missionUpdate();


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================
CONTROLS
========================= */

function left(){

  targetLane--;

  if(targetLane<0)
    targetLane=0;

}


function right(){

  targetLane++;

  if(targetLane>2)
    targetLane=2;

}


function jumpPlayer(){

  if(
    running&&
    jump===0
  ){

    jump=1;
    jumpVelocity=18;

  }

}


document.getElementById(
  "left"
).onclick=left;


document.getElementById(
  "right"
).onclick=right;


document.getElementById(
  "jump"
).onclick=jumpPlayer;


/* =========================
SWIPE CONTROLS
========================= */

let startX=0;
let startY=0;


canvas.addEventListener(
  "touchstart",
  function(e){

    startX=
    e.touches[0].clientX;

    startY=
    e.touches[0].clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  function(e){

    if(!running)return;

    const x=
    e.changedTouches[0].clientX;

    const y=
    e.changedTouches[0].clientY;

    const dx=x-startX;
    const dy=y-startY;


    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>40)
        right();

      if(dx<-40)
        left();

    }else{

      if(dy<-40)
        jumpPlayer();

    }

  },
  {passive:true}
);


/* KEYBOARD */

document.addEventListener(
"keydown",
function(e){

  if(e.key==="ArrowLeft")
    left();

  if(e.key==="ArrowRight")
    right();

  if(
    e.key==="ArrowUp"||
    e.code==="Space"
  )
    jumpPlayer();

});


/* BUTTONS */

document.getElementById(
  "startButton"
).onclick=startGame;


document.getElementById(
  "restart"
).onclick=function(){

  document.getElementById(
    "gameOver"
  ).style.display="none";

  startGame();

};


/* INITIAL DRAW */

drawWorld();

</script>

</body>
      </html>
