<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>My Runner Game</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#70c9ff;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  color:white;
  font:bold 20px Arial;
  text-shadow:2px 2px 4px #000;
}

#buttons{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
}

button{
  width:75px;
  height:60px;
  border:0;
  border-radius:18px;
  font-size:28px;
  font-weight:bold;
  background:#ffffffcc;
}

#jump{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <span>🏆 Score: <b id="score">0</b></span>
  <span>🪙 Coins: <b id="coins">0</b></span>
</div>

<div id="buttons">
  <button id="left">⬅️</button>
  <button id="right">➡️</button>
</div>

<button id="jump">⬆️</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}

resize();
window.addEventListener("resize",resize);


/* आपका कैरेक्टर */
const playerImage = new Image();
playerImage.src = "character.jpg";


/* GAME VARIABLES */

let playerLane = 1;
let targetLane = 1;

let playerY;
let jump = 0;
let jumpSpeed = 0;

let score = 0;
let coins = 0;

let speed = 6;

let obstacles = [];
let coinObjects = [];

let gameRunning = true;


/* तीन लेन */

function laneX(lane){

  const roadLeft = W * 0.15;
  const roadWidth = W * 0.70;

  return roadLeft +
         roadWidth * (lane + 0.5) / 3;
}


/* PLAYER */

function drawPlayer(){

  playerY = H * 0.78 - jump;

  let x = laneX(playerLane);

  let size = Math.min(W * 0.25,150);

  ctx.drawImage(
    playerImage,
    x-size/2,
    playerY-size,
    size,
    size
  );
}


/* ROAD */

function drawRoad(){

  ctx.fillStyle="#55a84f";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#333";
  ctx.beginPath();

  ctx.moveTo(W*0.35,0);
  ctx.lineTo(W*0.65,0);
  ctx.lineTo(W*0.95,H);
  ctx.lineTo(W*0.05,H);

  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="white";
  ctx.lineWidth=4;

  for(let i=1;i<3;i++){

    ctx.beginPath();

    ctx.moveTo(
      W*0.35 + (W*0.30/3)*i,
      0
    );

    ctx.lineTo(
      W*0.05 + (W*0.90/3)*i,
      H
    );

    ctx.stroke();
  }
}


/* OBSTACLE */

function createObstacle(){

  obstacles.push({

    lane:Math.floor(Math.random()*3),

    y:-80

  });

}


function drawObstacles(){

  ctx.fillStyle="#e52b2b";

  obstacles.forEach(o=>{

    let x = laneX(o.lane);

    ctx.fillRect(
      x-30,
      o.y,
      60,
      70
    );

  });
}


/* COIN */

function createCoin(){

  coinObjects.push({

    lane:Math.floor(Math.random()*3),

    y:-30

  });

}


function drawCoins(){

  coinObjects.forEach(c=>{

    let x=laneX(c.lane);

    ctx.fillStyle="#ffd21c";

    ctx.beginPath();

    ctx.arc(
      x,
      c.y,
      14,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

}


/* COLLISION */

function collision(o){

  if(
    o.lane === playerLane &&
    Math.abs(o.y-playerY)<60 &&
    jump<40
  ){

    gameRunning=false;

    alert(
      "GAME OVER\n\nScore: "+
      Math.floor(score)+
      "\nCoins: "+
      coins
    );

    location.reload();

  }

}


/* GAME LOOP */

function gameLoop(){

  if(!gameRunning)return;

  ctx.clearRect(0,0,W,H);

  drawRoad();


  /* PLAYER LANE SMOOTH MOVEMENT */

  playerLane +=
    (targetLane-playerLane)*0.2;


  /* OBSTACLES */

  obstacles.forEach(o=>{

    o.y += speed;

    collision(o);

  });


  obstacles =
    obstacles.filter(o=>o.y<H+100);


  /* COINS */

  coinObjects.forEach(c=>{

    c.y += speed;

    if(
      c.lane===playerLane &&
      Math.abs(c.y-playerY)<50
    ){

      coins++;

      score+=10;

      c.y=H+200;

    }

  });


  coinObjects =
    coinObjects.filter(c=>c.y<H+100);


  drawObstacles();

  drawCoins();


  /* JUMP */

  if(jump>0 || jumpSpeed!==0){

    jump += jumpSpeed;

    jumpSpeed -= 1;

    if(jump<=0){

      jump=0;
      jumpSpeed=0;

    }

  }


  drawPlayer();


  score += 0.1;

  document.getElementById("score")
          .textContent=Math.floor(score);

  document.getElementById("coins")
          .textContent=coins;


  requestAnimationFrame(gameLoop);
}


/* BUTTONS */

document.getElementById("left")
.onclick=function(){

  targetLane--;

  if(targetLane<0)
    targetLane=0;

};


document.getElementById("right")
.onclick=function(){

  targetLane++;

  if(targetLane>2)
    targetLane=2;

};


document.getElementById("jump")
.onclick=function(){

  if(jump===0){

    jump=1;

    jumpSpeed=17;

  }

};


/* KEYBOARD */

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft")
    document.getElementById("left").click();

  if(e.key==="ArrowRight")
    document.getElementById("right").click();

  if(e.key==="ArrowUp" || e.code==="Space")
    document.getElementById("jump").click();

});


/* OBJECT SPAWN */

setInterval(function(){

  if(gameRunning)
    createObstacle();

},900);


setInterval(function(){

  if(gameRunning)
    createCoin();

},600);


/* START */

gameLoop();

</script>

</body>
</html>
