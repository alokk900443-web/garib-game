<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>गरीब से अमीर - बड़ा गेम</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#7bc94f;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* ================= WORLD ================= */

#world{
    position:absolute;
    left:0;
    top:0;
    width:5000px;
    height:100%;
    background:#7bc94f;
    transition:left .08s linear;
}

/* SKY */

#sky{
    position:absolute;
    left:0;
    top:0;
    width:5000px;
    height:48%;
    background:linear-gradient(#61c9ff,#d5f5ff);
}

#sun{
    position:absolute;
    top:45px;
    left:450px;
    width:70px;
    height:70px;
    background:#ffd83d;
    border-radius:50%;
    box-shadow:0 0 30px #fff49a;
}

/* clouds */

.cloud{
    position:absolute;
    width:130px;
    height:40px;
    background:white;
    border-radius:40px;
    opacity:.85;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:55px;
    height:55px;
    left:20px;
    top:-25px;
}

.cloud:after{
    width:65px;
    height:65px;
    right:10px;
    top:-32px;
}

.c1{left:150px;top:90px}
.c2{left:900px;top:140px}
.c3{left:1900px;top:75px}
.c4{left:3100px;top:130px}
.c5{left:4200px;top:70px}

/* ground */

#ground{
    position:absolute;
    left:0;
    top:48%;
    width:5000px;
    height:52%;
    background:#7bc94f;
}

/* ROAD */

#road{
    position:absolute;
    left:0;
    bottom:0;
    width:5000px;
    height:31%;
    background:#555;
    border-top:5px solid #777;
}

.line{
    position:absolute;
    top:50%;
    width:120px;
    height:8px;
    background:white;
}

.l1{left:100px}
.l2{left:350px}
.l3{left:600px}
.l4{left:850px}
.l5{left:1100px}
.l6{left:1350px}
.l7{left:1600px}
.l8{left:1850px}
.l9{left:2100px}
.l10{left:2350px}
.l11{left:2600px}
.l12{left:2850px}
.l13{left:3100px}
.l14{left:3350px}
.l15{left:3600px}
.l16{left:3850px}
.l17{left:4100px}
.l18{left:4350px}
.l19{left:4600px}
.l20{left:4850px}

/* ================= BUILDINGS ================= */

.building{
    position:absolute;
    bottom:31%;
}

/* घर */

.house{
    left:120px;
    width:180px;
    height:130px;
    background:#d99d65;
    border:5px solid #815033;
}

.house .roof{
    position:absolute;
    left:-25px;
    top:-65px;
    width:220px;
    height:80px;
    background:#a94735;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.house .door{
    position:absolute;
    bottom:0;
    left:65px;
    width:45px;
    height:70px;
    background:#70452e;
}

.house .window{
    position:absolute;
    top:28px;
    right:18px;
    width:45px;
    height:38px;
    background:#8fe4ff;
    border:5px solid #70452e;
}

/* farm */

.farm{
    left:900px;
    width:260px;
    height:120px;
    background:#a97435;
    border:5px solid #744b20;
}

.farm:before{
    content:"🌾 🌾 🌾 🌾 🌾";
    position:absolute;
    left:25px;
    top:35px;
    font-size:35px;
}

/* दुकान */

.shop{
    left:1500px;
    width:210px;
    height:125px;
    background:#f4c45f;
    border:5px solid #805d28;
}

.shop .roof{
    position:absolute;
    left:-5px;
    top:-35px;
    width:210px;
    height:40px;
    background:#e53935;
}

.shopText{
    text-align:center;
    margin-top:42px;
    font-size:23px;
    font-weight:bold;
}

/* market */

.market{
    left:2200px;
    width:250px;
    height:140px;
    background:#efb84d;
    border:5px solid #8a6326;
}

.market .roof{
    position:absolute;
    left:-5px;
    top:-40px;
    width:250px;
    height:45px;
    background:#673ab7;
}

.marketText{
    text-align:center;
    margin-top:48px;
    font-size:24px;
    font-weight:bold;
}

/* city building */

.city{
    left:3000px;
    width:220px;
    height:230px;
    background:#b9c7d3;
    border:5px solid #56636d;
}

.city:before{
    content:"🏢";
    position:absolute;
    left:65px;
    top:55px;
    font-size:95px;
}

.cityText{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

/* bank */

.bank{
    left:3650px;
    width:270px;
    height:150px;
    background:#eee;
    border:5px solid #555;
}

.bank:before{
    content:"🏦";
    position:absolute;
    left:85px;
    top:30px;
    font-size:75px;
}

.bankText{
    position:absolute;
    bottom:5px;
    width:100%;
    text-align:center;
    font-weight:bold;
    font-size:22px;
}

/* mansion */

.mansion{
    left:4350px;
    width:300px;
    height:190px;
    background:#f4e4c1;
    border:6px solid #75582d;
}

.mansion:before{
    content:"🏠";
    position:absolute;
    left:90px;
    top:15px;
    font-size:110px;
}

.mansionText{
    position:absolute;
    bottom:8px;
    width:100%;
    text-align:center;
    font-weight:bold;
    font-size:24px;
}

/* ================= PLAYER ================= */

#player{
    position:absolute;
    z-index:50;
    left:250px;
    top:58%;
    width:50px;
    height:85px;
}

.head{
    position:absolute;
    left:10px;
    top:0;
    width:30px;
    height:30px;
    background:#c98252;
    border:2px solid #743f28;
    border-radius:50%;
}

.hair{
    position:absolute;
    left:9px;
    top:-3px;
    width:32px;
    height:14px;
    background:#222;
    border-radius:20px 20px 5px 5px;
}

.body{
    position:absolute;
    left:7px;
    top:30px;
    width:36px;
    height:36px;
    background:#2876c7;
    border-radius:8px;
}

.arm{
    position:absolute;
    top:33px;
    width:10px;
    height:30px;
    background:#c98252;
    border-radius:10px;
}

.arm.left{left:0}
.arm.right{right:0}

.leg{
    position:absolute;
    top:63px;
    width:12px;
    height:23px;
    background:#333;
    border-radius:6px;
}

.leg.left{left:10px}
.leg.right{right:10px}

/* ================= UI ================= */

#ui{
    position:fixed;
    z-index:300;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    gap:5px;
}

.stat{
    background:rgba(0,0,0,.78);
    color:white;
    padding:9px 10px;
    border-radius:13px;
    font-size:14px;
    font-weight:bold;
}

#mission{
    position:fixed;
    z-index:300;
    top:65px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:450px;
    background:white;
    border-radius:16px;
    padding:10px;
    text-align:center;
    font-weight:bold;
    box-shadow:0 4px 10px #0003;
}

/* location */

#location{
    position:fixed;
    z-index:300;
    top:115px;
    left:50%;
    transform:translateX(-50%);
    background:#000b;
    color:white;
    padding:7px 18px;
    border-radius:20px;
    font-weight:bold;
}

/* action */

#action{
    position:fixed;
    z-index:350;
    bottom:95px;
    left:50%;
    transform:translateX(-50%);
    border:0;
    background:#ff9f1c;
    color:#111;
    padding:14px 30px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    display:none;
}

/* controls */

#controls{
    position:fixed;
    z-index:350;
    bottom:15px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:10px;
}

.btn{
    width:65px;
    height:58px;
    border:0;
    border-radius:17px;
    background:#111d;
    color:white;
    font-size:24px;
    font-weight:bold;
}

.btn:active{
    transform:scale(.9);
}

/* popup */

#popup{
    position:fixed;
    z-index:500;
    display:none;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:86%;
    max-width:360px;
    background:white;
    padding:22px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 10px 40px #0008;
}

#popup button{
    border:0;
    background:#20a84b;
    color:white;
    padding:12px 28px;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

/* arrows */

#hint{
    position:fixed;
    z-index:300;
    bottom:170px;
    left:50%;
    transform:translateX(-50%);
    background:#000b;
    color:white;
    padding:8px 15px;
    border-radius:15px;
    font-size:13px;
}
</style>
</head>

<body>

<div id="game">

<div id="world">

<div id="sky"></div>

<div id="sun"></div>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="cloud c4"></div>
<div class="cloud c5"></div>

<div id="ground"></div>

<div id="road">

<div class="line l1"></div>
<div class="line l2"></div>
<div class="line l3"></div>
<div class="line l4"></div>
<div class="line l5"></div>
<div class="line l6"></div>
<div class="line l7"></div>
<div class="line l8"></div>
<div class="line l9"></div>
<div class="line l10"></div>
<div class="line l11"></div>
<div class="line l12"></div>
<div class="line l13"></div>
<div class="line l14"></div>
<div class="line l15"></div>
<div class="line l16"></div>
<div class="line l17"></div>
<div class="line l18"></div>
<div class="line l19"></div>
<div class="line l20"></div>

</div>

<!-- घर -->
<div class="building house">
<div class="roof"></div>
<div class="door"></div>
<div class="window"></div>
</div>

<!-- खेत -->
<div class="building farm"></div>

<!-- दुकान -->
<div class="building shop">
<div class="roof"></div>
<div class="shopText">🛒 दुकान</div>
</div>

<!-- बाजार -->
<div class="building market">
<div class="roof"></div>
<div class="marketText">🏪 बड़ा बाजार</div>
</div>

<!-- शहर -->
<div class="building city">
<div class="cityText">🏙️ शहर</div>
</div>

<!-- बैंक -->
<div class="building bank">
<div class="bankText">बैंक</div>
</div>

<!-- बड़ा घर -->
<div class="building mansion">
<div class="mansionText">💎 बड़ा घर</div>
</div>

</div>

<!-- PLAYER -->
<div id="player">

<div class="head"></div>
<div class="hair"></div>
<div class="body"></div>
<div class="arm left"></div>
<div class="arm right"></div>
<div class="leg left"></div>
<div class="leg right"></div>

</div>

</div>

<!-- UI -->

<div id="ui">

<div class="stat">
💰 ₹<span id="money">0</span>
</div>

<div class="stat">
⭐ लेवल <span id="level">1</span>
</div>

<div class="stat">
🍚 <span id="food">3</span>
</div>

</div>

<div id="mission">
🎯 मिशन: दुकान तक जाओ
</div>

<div id="location">
🏚️ गाँव
</div>

<div id="hint">
➡️ आगे चलकर नई जगह खोजो
</div>

<button id="action">
💼 काम करो
</button>

<!-- controls -->

<div id="controls">

<button class="btn" onclick="movePlayer(-35)">⬅️</button>

<button class="btn" onclick="movePlayer(35)">➡️</button>

</div>

<div id="popup">

<h2 id="popupTitle">मिशन</h2>

<p id="popupText"></p>

<button onclick="closePopup()">
ठीक है 👍
</button>

</div>

<script>

let money=0;
let food=3;
let level=1;

let playerX=250;

let missionIndex=0;

const missions=[
{
text:"🎯 मिशन 1: दुकान तक जाओ",
x:1500,
reward:100,
location:"दुकान"
},
{
text:"🎯 मिशन 2: खेत में काम करो",
x:900,
reward:150,
location:"खेत"
},
{
text:"🎯 मिशन 3: बाजार तक जाओ",
x:2200,
reward:250,
location:"बड़ा बाजार"
},
{
text:"🎯 मिशन 4: शहर पहुँचो",
x:3000,
reward:400,
location:"शहर"
},
{
text:"🎯 मिशन 5: बैंक तक जाओ",
x:3650,
reward:700,
location:"बैंक"
},
{
text:"🎯 मिशन 6: अपना बड़ा घर खरीदो",
x:4350,
reward:1500,
location:"बड़ा घर"
}
];

const player=document.getElementById("player");
const world=document.getElementById("world");

const moneyText=document.getElementById("money");
const foodText=document.getElementById("food");
const levelText=document.getElementById("level");

const missionBox=document.getElementById("mission");
const locationBox=document.getElementById("location");
const action=document.getElementById("action");

function saveGame(){

localStorage.setItem(
"garibGame",
JSON.stringify({
money:money,
food:food,
level:level,
playerX:playerX,
missionIndex:missionIndex
})
);

}

function loadGame(){

let save=localStorage.getItem("garibGame");

if(!save)return;

try{

let data=JSON.parse(save);

money=data.money||0;
food=data.food||3;
level=data.level||1;
playerX=data.playerX||250;
missionIndex=data.missionIndex||0;

}catch(e){}

}

function updateUI(){

moneyText.textContent=money;

foodText.textContent=food;

levelText.textContent=level;

missionBox.textContent=
missions[missionIndex]?.text ||
"🏆 सभी मिशन पूरे!";

}

function updatePlayer(){

player.style.left=playerX+"px";

/*
कैमरा खिलाड़ी के साथ चलेगा
*/

let cameraX=
window.innerWidth/2-playerX;

cameraX=Math.min(
0,
Math.max(
window.innerWidth-5000,
cameraX
)
);

world.style.left=cameraX+"px";

checkMission();

}

function movePlayer(amount){

playerX+=amount;

playerX=Math.max(
50,
Math.min(4900,playerX)
);

updatePlayer();

saveGame();

}

function checkMission(){

if(missionIndex>=missions.length){

locationBox.textContent="🏆 अमीर शहर";

action.style.display="block";

action.textContent="🏠 बड़ा घर";

return;
}

let mission=missions[missionIndex];

let distance=
Math.abs(playerX-mission.x);

if(distance<150){

locationBox.textContent=
"📍 "+mission.location;

action.style.display="block";

action.textContent=
"🎯 मिशन पूरा करो";

}else{

action.style.display="none";

if(playerX<700){

locationBox.textContent="🏚️ गाँव";

}else if(playerX<1300){

locationBox.textContent="🌾 खेत";

}else if(playerX<1900){

locationBox.textContent="🛒 दुकान";

}else if(playerX<2700){

locationBox.textContent="🏪 बाजार";

}else if(playerX<3400){

locationBox.textContent="🏙️ शहर";

}else if(playerX<4100){

locationBox.textContent="🏦 बैंक";

}else{

locationBox.textContent="💎 अमीर इलाका";

}

}

}

action.onclick=function(){

completeMission();

};

function completeMission(){

if(missionIndex>=missions.length){

showPopup(
"🏆 गेम जीत गए!",
"अब तुम्हारे पास बड़ा घर है। अगले अपडेट में बाइक, कार और नई नौकरियाँ आएँगी।"
);

return;
}

let mission=missions[missionIndex];

money+=mission.reward;

missionIndex++;

level=
Math.floor(money/300)+1;

moneyText.textContent=money;
levelText.textContent=level;

saveGame();

if(missionIndex<missions.length){

showPopup(
"🎉 मिशन पूरा!",
"₹"+mission.reward+
" मिले!\n\nअब नया मिशन शुरू हो गया है।"
);

}else{

showPopup(
"🏆 गरीब से अमीर!",
"सभी मिशन पूरे हो गए!\n\nतुमने अपना बड़ा घर हासिल कर लिया।"
);

}

updateUI();

checkMission();

}

function showPopup(title,text){

document.getElementById(
"popupTitle"
).textContent=title;

document.getElementById(
"popupText"
).textContent=text;

document.getElementById(
"popup"
).style.display="block";

}

function closePopup(){

document.getElementById(
"popup"
).style.display="none";

}

/* keyboard */

document.addEventListener(
"keydown",
function(e){

if(e.key==="ArrowRight"){
movePlayer(35);
}

if(e.key==="ArrowLeft"){
movePlayer(-35);
}

}
);

/* touch swipe */

let touchStartX=0;

document.addEventListener(
"touchstart",
function(e){

touchStartX=
e.touches[0].clientX;

},
{passive:true}
);

document.addEventListener(
"touchend",
function(e){

let endX=
e.changedTouches[0].clientX;

let difference=
endX-touchStartX;

if(Math.abs(difference)>50){

if(difference>0){

movePlayer(70);

}else{

movePlayer(-70);

}

}

},
{passive:true}
);

window.addEventListener(
"resize",
updatePlayer
);

/* start */

loadGame();

updateUI();

updatePlayer();

</script>

</body>
  </html>
