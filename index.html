<style>

  box-sizing:border-box;

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#79c94d;
}

/* ================= पूरी दुनिया ================= */

#world{
  position:absolute;
  left:0;
  top:0;
  width:12000px;
  height:100%;
}

/* आसमान */
#sky{
  position:absolute;
  top:0;
  left:0;
  width:12000px;
  height:60%;

}

/* सूरज */

  position:absolute;
  top:45px;
  left:600px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#ffd735;
}

/* जमीन */
#grass{
  position:absolute;
  left:0;
  top:60%;
  width:12000px;
  height:40%;
  background:#78c94d;
}

/* ================= सड़क ================= */

#road{
  position:absolute;
  left:0;
  top:67%;
  width:12000px;
  height:33%;
  background:#505050;
  border-top:8px solid #777;
  border-bottom:8px solid #303030;
}

/* सड़क की बीच की लाइन */
.roadLine{
  position:absolute;
  top:50%;
  width:140px;
  height:10px;
  background:white;
  border-radius:5px;
}

/* बहुत सारे पॉइंट */
.roadPoint{
  position:absolute;
  top:36%;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#ffd21c;
  border:4px solid white;
  box-shadow:0 0 10px #0006;
  z-index:5;
}

/* सड़क लाइनें */
.l1{left:50px}.l2{left:300px}.l3{left:550px}
.l4{left:800px}.l5{left:1050px}.l6{left:1300px}

.place{

  font-weight:bold;

}

/* गाँव का घर */

/* फैक्ट्री */

/* ================= आदमी ================= */

#player{

  z-index:100;
  left:300px;

  /* आदमी अब सड़क पर */
  top:65%;

  width:55px;
  height:100px;

  transition:left .12s linear;
}

/* सिर */
.head{
  position:absolute;
  left:12px;
  top:0;
  width:32px;
  height:32px;
  background:#c98252;
  border-radius:50%;
  border:2px solid #713e28;
}

/* बाल */
.hair{
  position:absolute;
  left:10px;
  top:-4px;
  width:36px;
  height:15px;
  background:#222;
  border-radius:20px 20px 5px 5px;
}

/* शरीर */
.body{
  position:absolute;
  left:8px;
  top:31px;
  width:40px;
  height:40px;
  background:#2879c7;
  border-radius:8px;
}

/* हाथ */
.arm{
  position:absolute;
  top:34px;
  width:11px;
  height:32px;
  background:#c98252;
  border-radius:10px;
  transform-origin:top center;
}

.arm1{left:0}
.arm2{right:0}

/* पैर */
.leg{
  position:absolute;
  top:69px;
  width:13px;
  height:28px;
  background:#292929;
  border-radius:8px;
  transform-origin:top center;
}

.leg1{left:11px}
.leg2{right:11px}

/* आदमी चले तो animation */
#player.walking .leg1{
  animation:walk1 .22s infinite alternate;
}

#player.walking .leg2{
  animation:walk2 .22s infinite alternate;
}

#player.walking .arm1{
  animation:arm1 .22s infinite alternate;
}

#player.walking .arm2{
  animation:arm2 .22s infinite alternate;
}

@keyframes walk1{
  from{transform:rotate(25deg)}
  to{transform:rotate(-25deg)}
}

@keyframes walk2{
  from{transform:rotate(-25deg)}
  to{transform:rotate(25deg)}
}

@keyframes arm1{
  from{transform:rotate(-20deg)}
  to{transform:rotate(20deg)}
}

@keyframes arm2{
  from{transform:rotate(20deg)}
  to{transform:rotate(-20deg)}
}

/* ================= UI ================= */

#ui{
  position:fixed;
  z-index:200;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:6px;

/* मिशन */
#mission{
  position:fixed;
  z-index:200;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:500px;
  background:white;
  border-radius:18px;
  padding:12px;
  text-align:center;
  font-weight:bold;
  font-size:17px;

/* लोकेशन */
#location{
  position:fixed;
  z-index:200;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 18px;
  background:#000b;
  color:white;
  border-radius:20px;
}

/* चेकपॉइंट नाम */
.checkName{
  position:absolute;
  top:-38px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:5px 10px;
  border-radius:10px;
  white-space:nowrap;
  font-size:14px;
}

/* ================= बटन ================= */

#controls{
  position:fixed;
  z-index:300;
  bottom:15px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

.btn{
  height:62px;
  min-width:110px;
  border:0;
  border-radius:20px;
  background:#111;
  color:white;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 4px 8px #0005;
}

.forward{
  min-width:170px;
  background:#ff9f1c;
  color:#111;
}

/* मिशन बटन */
#work{
  position:fixed;
  z-index:300;
  display:none;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  border:0;
  padding:14px 30px;
  border-radius:20px;
  background:#20b957;
  color:white;
  font-size:18px;
  font-weight:bold;
}

/* popup */
#popup{
  position:fixed;
  z-index:500;
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:88%;
  max-width:370px;
  background:white;
  border-radius:22px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 40px #0008;
}

#popup button{
  border:0;
  padding:12px 28px;
  border-radius:12px;
  background:#159447;
  color:white;
  font-size:17px;
  font-weight:bold;
}

/* मोबाइल */
@media(max-width:500px){
  .stat{
    padding:8px 9px;
    font-size:13px;
  }

  #mission{
    font-size:15px;
  }

  #location{
    top:118px;
    font-size:14px;
  }
}
</style>
</head>

<script>

let money=0;
let level=1;
let food=3;

let playerX=300;

let missionIndex=0;

/* बहुत लंबी यात्रा */
const missions=[

{x:1500,name:"खेत",reward:150},

{x:2800,name:"दुकान",reward:250},

{x:4100,name:"बड़ा बाजार",reward:400},

{x:5500,name:"शहर",reward:600},

{x:6900,name:"बैंक",reward:900},

{x:8100,name:"फैक्ट्री",reward:1200},

{x:9200,name:"होटल",reward:1600},

{x:10300,name:"ऑफिस",reward:2200},

{x:11500,name:"बड़ा घर",reward:5000}

];

const player=
document.getElementById("player");

const world=
document.getElementById("world");


/* ================= चलना ================= */

function movePlayer(amount){

  playerX += amount;

  playerX =
  Math.max(
    100,
    Math.min(
      11800,
      playerX
    )
  );

  /* चलने की animation */
  player.classList.add("walking");

  clearTimeout(window.walkTimer);

  window.walkTimer=setTimeout(function(){

    player.classList.remove("walking");

  },300);

  updatePlayer();

  saveGame();
}


/* ================= कैमरा ================= */

function updatePlayer(){

  player.style.left =
  playerX+"px";

  /* खिलाड़ी के साथ दुनिया चलेगी */

  let camera =
  window.innerWidth/2-playerX;

  camera =
  Math.min(
    0,
    Math.max(
      window.innerWidth-12000,
      camera
    )
  );

  world.style.left =
  camera+"px";

  checkMission();
}


/* ================= मिशन ================= */

function checkMission(){

  if(missionIndex>=missions.length){

    document.getElementById("mission")
    .textContent=
    "🏆 सभी मिशन पूरे! तुम अमीर बन गए!";

    document.getElementById("location")
    .textContent=
    "💎 अमीर";

    document.getElementById("work")
    .style.display="block";

    return;
  }

  let mission=
  missions[missionIndex];

  let distance=
  Math.abs(
    playerX-mission.x
  );

  if(distance<150){

    document.getElementById("location")
    .textContent=
    "📍 "+mission.name;

    document.getElementById("work")
    .style.display="block";

  }else{

    document.getElementById("work")
    .style.display="none";

    if(playerX<800){

      locationText("🏚️ गाँव");

    }else if(playerX<2200){

      locationText("🌾 खेत वाला इलाका");

    }else if(playerX<3500){

      locationText("🛒 दुकान वाला इलाका");

    }else if(playerX<4800){

      locationText("🏪 बाजार");

    }else if(playerX<6200){

      locationText("🏙️ शहर");

    }else if(playerX<7500){

      locationText("🏦 बैंक");

    }else if(playerX<8700){

      locationText("🏭 फैक्ट्री");

    }else if(playerX<9700){

      locationText("🏨 होटल");

    }else if(playerX<11000){

      locationText("🏢 ऑफिस");

    }else{

      locationText("💎 अमीर इलाका");

    }

  }

}


function locationText(text){

  document.getElementById("location")
  .textContent=text;

}


/* ================= मिशन पूरा ================= */

function completeMission(){

  if(missionIndex>=missions.length){

    showPopup(
      "🏆 गेम पूरा!",
      "तुम गरीब से अमीर बन गए! 💎"
    );

    return;
  }

  let mission=
  missions[missionIndex];

  money += mission.reward;

  missionIndex++;

  level=
  Math.floor(
    money/500
  )+1;

  document.getElementById("money")
  .textContent=money;

  document.getElementById("level")
  .textContent=level;

  if(missionIndex<missions.length){

    document.getElementById("mission")
    .textContent=
    "🎯 मिशन "+
    (missionIndex+1)+
    ": "+
    missions[missionIndex].name+
    " तक जाओ";

  }else{

    document.getElementById("mission")
    .textContent=
    "🏆 सभी मिशन पूरे!";
  }

  document.getElementById("work")
  .style.display="none";

  saveGame();

  showPopup(
    "🎉 मिशन पूरा!",
    "₹"+mission.reward+
    " मिले! 💰\n\nअब अगली जगह की ओर जाओ।"
  );
}


/* ================= Popup ================= */

function showPopup(title,text){

  document.getElementById("popupTitle")
  .textContent=title;

  document.getElementById("popupText")
  .textContent=text;

  document.getElementById("popup")
  .style.display="block";
}


function closePopup(){

  document.getElementById("popup")
  .style.display="none";
}


/* ================= SAVE ================= */

function saveGame(){

  localStorage.setItem(
    "garibGame",
    JSON.stringify({

      money:money,

      level:level,

      food:food,

      playerX:playerX,

      missionIndex:missionIndex

    })
  );
}


/* ================= LOAD ================= */

function loadGame(){

  let data=
  localStorage.getItem(
    "garibGame"
  );

  if(!data)return;

  try{

    data=
    JSON.parse(data);

    money=
    data.money||0;

    level=
    data.level||1;

    food=
    data.food||3;

    playerX=
    data.playerX||300;

    missionIndex=
    data.missionIndex||0;

  }catch(e){}

  document.getElementById("money")
  .textContent=money;

  document.getElementById("level")
  .textContent=level;
}


/* शुरुआत */

loadGame();

updatePlayer();

</script>
